changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Documentation & Chores
      labels:
        - docs
        - chore
    - title: Other Changes
      labels:
        - "*"
