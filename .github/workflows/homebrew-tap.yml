name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.2)"
        required: true

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and SHA-256
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          SHA256="$(curl -fsSL "https://github.com/Blinks44/rebind/releases/download/${TAG}/SHA256SUMS.txt" | awk '/Rebind\.dmg$/ {print $1}')"
          test -n "${SHA256}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: Blinks44/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Render Casks/rebind.rb and push
        run: |
          .github/scripts/render-homebrew-cask.sh "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.sha256 }}" > tap/Casks/rebind.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Casks/rebind.rb; then
            echo "Cask already up to date"
            exit 0
          fi
          git add Casks/rebind.rb
          git commit -m "chore: bump rebind to v${{ steps.meta.outputs.version }}"
          git push origin main
